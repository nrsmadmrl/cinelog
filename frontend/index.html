<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cinelog</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-logo" onclick="navigate('home')">🎬 Cinelog</div>
    <div class="nav-links">
      <button onclick="navigate('home')" class="nav-btn">Home</button>
      <button onclick="navigate('explore')" class="nav-btn">Explore</button>
      <div id="nav-auth">
        <button onclick="navigate('login')" class="nav-btn">Login</button>
        <button onclick="navigate('register')" class="nav-btn btn-primary">Register</button>
      </div>
      <div id="nav-user" style="display:none">
        <button onclick="navigate('profile')" class="nav-btn" id="nav-username"></button>
        <button onclick="logout()" class="nav-btn btn-danger">Logout</button>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main id="app"></main>

  <!-- MODAL -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modal-box">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

 <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/explore.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/register.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
